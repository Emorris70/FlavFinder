<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test page</title>
<!--    <link rel="stylesheet" href="css/auth.css">-->
    <link rel="stylesheet" href="css/homePage.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="js/script.js"></script>
</head>
<body>
<header>
<!--&lt;!&ndash;    Ensure to use the includes tag   &ndash;&gt;-->
        <div class="a-lc" role="img" aria-label="FlavFinder Logo">
            <h1 class="main-h1">
                FL
                <span class="img-c">
                    <img
                            src="images/location.png"
                            alt="location pin icon"
                            class="img-t"
                    /> </span
                >V
            </h1>
        </div>
        <div class="search-c">
            <img src="images/search-icon.png" class="inner-icon search-icon" alt="search icon">
            <input type="text" id="search" name="search-term" placeholder="Search for cuisines...">
            <span id="filter-trigger" class="filter-btn">
                <img src="images/tune.png" class="inner-icon filter-icon" alt="filter icon">
            </span>
<!--    add drop down container/content        -->
        </div>
        <div class="user-content">
            <div class="location-drop-container">
                <div class="location-p">
                    <button class="location-toggle-btn" id="location-toggle-btn">
                        <img src="images/near-me.png" class="inner-icon" alt="Near me Icon">
                        current location
                    </button>
                </div>
                <!--    add drop down content        -->
            </div>
            <div class="to-go-container">
<!--     Ensure to add a link to the to-go page when completed           -->
                <a href="#" id="to-go-deco">
                    <img src="images/favorite-heart.png" class="inner-icon" id="to-go-icon" alt="To-Go icon">
                    To-Go
                </a>
            </div>
            <div class="user-drop-container">
                <div class="user-toggle-btn">
                    <button class="user-name dropdown" id="user-pf">em</button>
                </div>
                <div class="user-dropdown-content drop-r">
                    <div class="to-go user-d-c">
                        <img src="images/favorite.png" alt="to-go icon" class="to-go-icon h-icon">
                        <a href="#">To-go</a>
                    </div>
                    <div class="settings user-d-c">
                        <img src="images/settings.png" alt="settings icon" class="settings-icon h-icon">
                        <a href="#">Settings</a>
                    </div>
                    <div class="log-out user-d-c">
                        <img src="images/logout.png" alt="logout icon" class="logout-icon h-icon">
                        <a href="${pageContext.request.contextPath}/logout">Logout</a>
                    </div>
                </div>
            </div>
        </div>
</header>
<main>
    <div class="home-content">
        <div class="category-section">
            <h2 class="section-heading">What's on the menu tonight?</h2>
            <div class="category-pills">
                <button class="pill active">All</button>
                <button class="pill">Italian</button>
                <button class="pill">Japanese</button>
                <button class="pill">Mexican</button>
                <button class="pill">American</button>
                <button class="pill">Thai</button>
                <button class="pill">Chinese</button>
                <button class="pill">Mediterranean</button>
                <button class="pill">Indian</button>
            </div>
        </div>

    </div>
</main>
<footer></footer>
</body>
</html>
