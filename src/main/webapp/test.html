<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test page</title>
    <script src="js/script.js"></script>
<!--    <link rel="stylesheet" href="css/auth.css">-->
    <link rel="stylesheet" href="css/homePage.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<header>
<!--&lt;!&ndash;    Ensure to use the includes tag   &ndash;&gt;-->
        <div class="a-lc" role="img" aria-label="FlavFinder Logo">
            <h1 class="main-h1">
                FL
                <span class="img-c">
                    <img
                            src="images/location.png"
                            alt="location pin icon"
                            class="img-t"
                    /> </span
                >V
            </h1>
        </div>
        <div class="search-c">
            <img src="images/search-icon.png" class="inner-icon search-icon" alt="search icon">
            <input type="text" id="search" name="search-term" placeholder="Search for cuisines...">
            <span id="filter-trigger" class="filter-btn">
                <img src="images/tune.png" class="inner-icon filter-icon" alt="filter icon">
            </span>
<!--    add drop down container/content        -->
        </div>
        <div class="user-content">
            <div class="location-drop-container">
                <div class="location-p">
                    <button class="location-toggle-btn" id="location-toggle-btn">
                        <img src="images/near-me.png" class="inner-icon" alt="Near me Icon">
                        current location
                    </button>
                </div>
                <!--    add drop down content        -->
            </div>
            <div class="to-go-container">
<!--     Ensure to add a link to the to-go page when completed           -->
                <a href="#" id="to-go-deco">
                    <img src="images/favorite-heart.png" class="inner-icon" id="to-go-icon" alt="To-Go icon">
                    To-Go
                </a>
            </div>
            <div class="user-drop-container">
                <div class="user-toggle-btn">
                    <button class="user-pf" id="user-pf"></button>
                </div>
                <!--    add drop down container/content        -->
                <div class="user-dropdown-content"></div>
            </div>
        </div>
</header>
<main>
<!--  The class attribute show should append to the parent rather  -->
    <div class="location-popUp-content pop-up-bg" id="pop-up">
        <div class="content-card-deco">
            <div class="drop-c">
                <p class="p-deco">Set Discovery Location</p>
                <p class="p-deco muted-con">Choose a location to discover nearby restaurants</p>
            </div>
            <div class="c-items">
                <button class="current-location-c">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         height="24px" viewBox="0 -960 960 960"
                         width="24px" fill="#e3e3e3">
                        <path d="M516-120 402-402 120-516v-56l720-268-268 720h-56Zm26-148 162-436-436 162 196 78 78 196Zm-78-196Z"/>
                    </svg>
                    <p class="p-h1">Use Current Location</p>
                    <p class="p-sub">Auto-detect location</p>
                </button>
                <div class="custom-location-c">
                    <!-- IMG -->
                    <p class="p-h1">Set Custom Location</p>
                    <p class="p-sub">Enter the city/code to explore</p>
                    <!-- INPUT-->
                    <button type="submit">Set</button>
                </div>
            </div>
        </div>
    </div>
</main>
<footer></footer>
</body>
</html>
